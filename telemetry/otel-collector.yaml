# Receives Claude Code's OTLP metrics and re-exposes them for Prometheus to
# scrape. Nothing is forwarded off the machine — the whole stack is local.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s

  # Drop the identity attributes before anything is stored. A single-developer
  # stack does not need them to answer "tokens per merged change", and
  # user.email in particular has no business sitting in a metrics store.
  #
  # This takes two processors, not one, and the difference is not cosmetic.
  # Claude Code sends the identity fields as *resource* attributes, and the
  # `attributes` processor only sees datapoint attributes. Worse, the
  # resource_to_telemetry_conversion below promotes resource attributes to
  # Prometheus labels inside the exporter — which runs after every processor —
  # so scrubbing datapoints alone looks correct in the config and ships
  # user_email to the metrics store anyway. Verified: with only the
  # `attributes` processor, a test payload arrived in Prometheus carrying
  # user_email and user_account_uuid as labels.
  resource/scrub:
    attributes:
      - key: user.email
        action: delete
      - key: user.id
        action: delete
      - key: user.account_uuid
        action: delete
      - key: user.account_id
        action: delete
      - key: organization.id
        action: delete

  # The same keys again, for the case where they arrive per-datapoint rather
  # than on the resource. Deleting a key that is not there is not an error.
  attributes/scrub:
    actions:
      - key: user.email
        action: delete
      - key: user.id
        action: delete
      - key: user.account_uuid
        action: delete
      - key: user.account_id
        action: delete
      - key: organization.id
        action: delete

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Without this the exporter appends unit and _total suffixes, so
    # claude_code.token.usage lands as claude_code_token_usage_tokens_total.
    # The dashboard queries the unsuffixed names, so keep them predictable.
    add_metric_suffixes: false
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resource/scrub, attributes/scrub, batch]
      exporters: [prometheus]
  telemetry:
    logs:
      level: warn
