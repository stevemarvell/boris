<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>linkjar</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header>
      <h1>linkjar</h1>
      <p class="sub">A shelf for things worth reading twice.</p>
    </header>

    <main>
      <form id="add-form" autocomplete="off">
        <input id="url" name="url" type="url" placeholder="https://..." required />
        <input id="title" name="title" type="text" placeholder="Title (optional)" />
        <input id="tags" name="tags" type="text" placeholder="tags, comma separated" />
        <button type="submit">Save</button>
      </form>
      <p id="error" class="error" hidden></p>

      <div class="filters">
        <input id="search" type="search" placeholder="Search" />
        <label><input id="unread" type="checkbox" /> Unread only</label>
      </div>

      <ul id="links" class="links"></ul>
      <p id="empty" class="empty" hidden>Nothing here yet.</p>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
