[project]
name = "family-tree-api"
version = "0.1.0"
description = "GraphQL API over a file-stored family tree."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "slowapi>=0.1.9",
    "strawberry-graphql[fastapi]>=0.253",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
