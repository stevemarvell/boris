[project]
name = "family-tree-api"
version = "0.1.0"
description = "GraphQL API over a file-stored family tree."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "slowapi==0.1.10",
    "strawberry-graphql[fastapi]==0.327.7",
    "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

# Vercel's Root Directory for this project is apps/api (#126), so entrypoint
# is resolved relative to this file's own directory: api.main:app would look
# for api/main.py here, but the real file is at src/api/main.py, hence the
# extra segment. Vercel checks this path exists on disk; it does not import
# the module to resolve it, so a package-vs-path mismatch fails at build time
# with a clear message rather than at runtime with an unclear one.
[tool.vercel]
entrypoint = "src.api.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
