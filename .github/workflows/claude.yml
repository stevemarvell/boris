name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude:
    # The `contains(..., '@claude')` checks alone would let anyone on the
    # internet trigger this job — this is a public repository. The job's own
    # permissions are read-only and claude-code-action does its own actor
    # check, but this guard means we are not relying solely on those: only a
    # comment or review from an OWNER, MEMBER, or COLLABORATOR is allowed to
    # trigger a run. The three trigger events carry author_association in
    # different places (issue_comment and pull_request_review_comment on
    # `comment`, pull_request_review on `review`), so each branch checks its
    # own field.
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    # Same telemetry wiring as claude-code-review.yml — see the long comment
    # there for why each line is the way it is. The only difference is the
    # workflow label in OTEL_RESOURCE_ATTRIBUTES, which is what lets the two
    # kinds of unattended run be told apart: a review that happens on every
    # pull request, and a tagged session somebody asked for.
    env:
      CLAUDE_CODE_ENABLE_TELEMETRY: ${{ secrets.GRAFANA_CLOUD_OTLP_AUTH != '' && '1' || '0' }}
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GRAFANA_CLOUD_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GRAFANA_CLOUD_OTLP_AUTH }}
      OTEL_METRIC_EXPORT_INTERVAL: '5000'
      OTEL_LOGS_EXPORT_INTERVAL: '5000'
      OTEL_RESOURCE_ATTRIBUTES: >-
        environment=ci,ci_provider=github-actions,workflow=claude-mention,run_id=${{ github.run_id }},run_attempt=${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

