name: verify

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Checkout is the only step that spends GITHUB_TOKEN, and it only reads.
    # The failure artifact rides the Actions runtime token, not this one.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: npm ci

      # Fails the build rather than resolving new versions silently, so CI
      # tests the same dependency set as a local run.
      - run: uv sync --directory apps/api --frozen

      - run: npx playwright install --with-deps chromium

      - run: npm run verify

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
