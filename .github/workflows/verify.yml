name: verify

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Checkout is the only step that spends GITHUB_TOKEN, and it only reads.
    # The failure artifact rides the Actions runtime token, not this one.
    permissions:
      contents: read

    steps:
      # Actions are pinned to a commit SHA, not a tag: a tag is a movable
      # pointer, and whoever owns the action's repository can repoint it at
      # any commit. The trailing comment is the human-readable version, and
      # .github/dependabot.yml opens the PRs that move these forward.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: npm ci

      # Fails the build rather than resolving new versions silently, so CI
      # tests the same dependency set as a local run.
      - run: uv sync --directory apps/api --frozen

      - run: npx playwright install --with-deps chromium

      - run: npm run verify

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
