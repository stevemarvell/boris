name: verify

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Checkout is the only step that spends GITHUB_TOKEN, and it only reads.
    # The failure artifact rides the Actions runtime token, not this one.
    permissions:
      contents: read

    steps:
      # Actions are pinned to a commit SHA, not a tag: a tag is a movable
      # pointer, and whoever owns the action's repository can repoint it at
      # any commit. The trailing comment is the human-readable version, and
      # .github/dependabot.yml opens the PRs that move these forward.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: 'apps/*/uv.lock'

      - run: npm ci

      # Fails the build rather than resolving new versions silently, so CI
      # tests the same dependency set as a local run.
      # Every Python app project.json declares (#173). Assigned first rather
      # than piped, so a failing lookup stops the step under `bash -e`.
      - run: |
          apps=$(node scripts/project.mjs apps python)
          for app in $apps; do uv sync --directory "$app" --frozen; done

      - run: npx playwright install --with-deps chromium

      - run: npm run verify

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: 'apps/*/playwright-report/'
          retention-days: 7
