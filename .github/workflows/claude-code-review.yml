name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

concurrency:
  group: claude-code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    # Telemetry for the unattended runs. This job fires on every pull request
    # and nobody watches it, which makes it the spend most worth measuring and
    # the spend least likely to be noticed. claude-code-action reads each of
    # these from env (see its action.yml), so setting them here is what reaches
    # the CLI.
    #
    # Gated on the credential existing: with telemetry on and no endpoint, the
    # exporter falls back to localhost:4317, which in a runner is nothing, and
    # every run would spend its exit retrying a connection to itself.
    env:
      CLAUDE_CODE_ENABLE_TELEMETRY: ${{ secrets.GRAFANA_CLOUD_OTLP_AUTH != '' && '1' || '0' }}
      OTEL_METRICS_EXPORTER: otlp

      # Events as well as metrics, because Grafana Cloud's Claude Code
      # integration reads both. OTEL_LOG_USER_PROMPTS, OTEL_LOG_TOOL_DETAILS
      # and OTEL_LOG_TOOL_CONTENT are deliberately ABSENT and must stay that
      # way: those are what turn events from "which tools ran, how long, which
      # model" into the prompts and file contents themselves. Unset is off.
      OTEL_LOGS_EXPORTER: otlp

      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

      # Required by the Grafana integration, and not a detail. Claude Code can
      # emit delta temporality, which a Prometheus-backed store silently drops
      # — the symptom is every panel reading "No data" with nothing in any log
      # to explain it.
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GRAFANA_CLOUD_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GRAFANA_CLOUD_OTLP_AUTH }}

      # Metrics only, exactly as locally. OTEL_LOGS_EXPORTER is left unset on
      # purpose: the events it would ship include claude_code.user_prompt and
      # claude_code.tool_result, and this repository's rule is to leave that
      # redaction alone. Not opening the pipe is how that is enforced.

      # 5s rather than the 10s used locally. A runner is torn down the moment
      # the job ends and a flush on exit is not documented, so a short review
      # could otherwise finish between exports and report nothing.
      OTEL_METRIC_EXPORT_INTERVAL: '5000'
      OTEL_LOGS_EXPORT_INTERVAL: '5000'

      # Without this, CI spend is indistinguishable from laptop spend in the
      # same store, and "tokens per merged PR" quietly absorbs it.
      OTEL_RESOURCE_ATTRIBUTES: >-
        environment=ci,ci_provider=github-actions,workflow=claude-code-review,run_id=${{ github.run_id }},run_attempt=${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

