# Vercel deploys the API from the repository root, not from apps/api.
#
# The reason is the same one apps/api/Dockerfile opens with: the service needs
# data/ and manual/api/, which live at the root. Vercel resolves this file
# against the project's root directory and excludes anything outside it, so
# pointing the project at apps/api would build a function that cannot read
# either. Rooting the project here puts both inside the bundle without the
# "include files outside the root directory" dashboard toggle, which would be
# deployment config living somewhere nobody working in the repository can see.
#
# Dependencies are not restated here. The uv workspace below keeps them
# declared once, in apps/api/pyproject.toml, and this file just depends on
# that package.
[project]
name = "boris"
version = "0.1.0"
description = "Deployment shell: serves apps/api from the repository root."
requires-python = ">=3.12"
dependencies = ["family-tree-api"]

[tool.uv.sources]
family-tree-api = { workspace = true }

[tool.uv.workspace]
members = ["apps/api"]
# apps/mcp declares family-tree-api as a path source rather than a workspace
# one, and uv refuses to have it both ways. It is not deployed, so it stays
# outside the workspace and keeps resolving exactly as it does today.
exclude = ["apps/mcp"]

# api.main already exposes a module-level `app`, so this points at it directly
# rather than introducing a second entrypoint file to keep in step.
[tool.vercel]
entrypoint = "api.main:app"
